# =============================================================================
# infra/traefik/config/secret.yaml
#
# Cloudflare DNS API 토큰 — Traefik ACME DNS-01 챌린지용
#
# 구조:
#   SealedSecret (Git에 저장, 암호화됨)
#     → sealed-secrets-controller 가 복호화
#       → Secret "cloudflare-dns-token" (kube-system) 생성
#         → HelmChartConfig 의 env.CF_DNS_API_TOKEN 으로 주입
#           → lego(Traefik 내장)가 _acme-challenge TXT 레코드를 쓴다
#
# 필요 권한 (Cloudflare 대시보드 → My Profile → API Tokens):
#   Zone : Zone : Read    ← lego 가 존을 찾을 때 사용
#   Zone : DNS  : Edit    ← _acme-challenge TXT 생성/삭제
#   Zone Resources: Include → Specific zone → neidn.com
#
#   Account ID : 511b1ece599473e71b7f4917b081b230
#   Zone ID    : e6dfcd099416e546fc5849ded5ee6d26  (neidn.com)
#
#   ※ 이 토큰은 account-owned 라서 /user/tokens/verify 엔드포인트는
#     "Invalid API Token" 을 반환한다. 정상이다. 실제 검증은
#     GET /zones/<zone_id> 로 할 것.
#
# ─── 최초 생성 / 토큰 교체 ────────────────────────────────────────────────────
#   kubectl create secret generic cloudflare-dns-token \
#     --namespace kube-system \
#     --from-literal=token=실제토큰값 \
#     --dry-run=client -o yaml \
#   | kubeseal \
#     --controller-name=sealed-secrets-controller \
#     --controller-namespace=kube-system \
#     --format yaml \
#     --namespace kube-system \
#   > infra/traefik/config/secret.yaml
#   # (이 주석 블록을 다시 파일 상단에 붙일 것)
#   git add infra/traefik/config/secret.yaml
#   git commit -m "fix(traefik): rotate cloudflare dns api token"
#   git push origin main
#   kubectl rollout restart deployment traefik -n kube-system
#
# ─── 주의 ─────────────────────────────────────────────────────────────────────
#   SealedSecret 은 현재 클러스터 공개키로 암호화된다. 클러스터 재구성 시
#   마스터키를 복원하지 않으면 복호화 불가 → 토큰 재발급 필요.
#   백업: kubectl get secret -n kube-system \
#           -l sealedsecrets.bitnami.com/sealed-secrets-key -o yaml > backup.yaml
#   ★ 백업 파일은 절대 Git 에 올리지 말 것
# =============================================================================

---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: cloudflare-dns-token
  namespace: kube-system
spec:
  encryptedData:
    token: 
  template:
    metadata:
      name: cloudflare-dns-token
      namespace: kube-system
